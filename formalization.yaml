# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "alpha-rar"
  authors:
    - "Rémy Degenne"
  responsible_maintainers:
    - "Rémy Degenne"
  # `AlphaRAR/Mathlib/CramerWold.lean` is not original to this project: it is a verbatim
  # vendoring (adapted to non-`module` syntax) of Mathlib PR #40345, by Ivo Malinowski,
  # kept here only until that PR is merged. It is credited in its own file header.
  license: "Apache-2.0"
  # extra keys (tolerated by the schema), kept for convenience:
  repository: "https://github.com/RemyDegenne/alpha-rar"
  blueprint: "https://remydegenne.github.io/alpha-rar/blueprint/"

# This repository is the substantive formalization, not a packaging or comparison layer.
repository:
  role: "substantive-development"

sources:
  - title: "On Response-Adaptive Targeting Strategies for Multi-Treatment Experiments"
    authors:
      - "Redouane Yagouti"
      - "Rémy Degenne"
      - "Emilie Kaufmann"
    id: "arXiv:2606.17777"
    type: "preprint"
    location: "the full paper except the hypothesis-testing application; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "participated"   # the formaliser is an author of the source paper
    note: >-
      The LaTeX source of the paper is vendored in this repository under `arxiv/`, and the
      formalization is driven by a blueprint (`blueprint/src/`) written by Claude Opus
      (4.8 first, then 5) alongside the formalization that decomposes the paper's proofs into
      small lemmas. The blueprint is a derived artifact of this project, not an independent source.

related_formalizations: []   # no earlier or parallel formalization of this paper is known

# The area of the formalized results: response-adaptive/sequential experimental design and its
# asymptotics, plus the martingale limit theory (SLLN, LIL, CLT) formalized as prerequisites.
classification:
  arxiv: ["math.ST", "math.PR"]
  msc2020:
    - "62L05"   # sequential statistical design
    - "62E20"   # asymptotic distribution theory (statistics)
    - "60F05"   # central limit and other weak theorems
    - "60F15"   # strong limit theorems (LIL, SLLN)
    - "60G42"   # martingales with discrete parameter

status:
  scope: >-
    The two main theorems of the paper are formalized for the αRTS design family, together with
    the forced-exploration variant αRTS-FE and three concrete design instances.

    Formalized (Part I of the blueprint): the model, estimators and Conditions A/B
    (`chap:model`); the αRTS family and the distance-based, ERADE-2025 and interpolated
    D-Tracking designs (`chap:design`); the auxiliary processes and technical lemmas
    (`chap:auxiliary`, `chap:technical`); the generic sufficient conditions and their
    verification for αRTS (`chap:generic`); strong consistency and rates (`chap:consistency`,
    `thm:LLN`); asymptotic normality, both parts (`chap:normality`, `thm:normality`); forced
    exploration, no-starvation, the sparse consistency rate and the sparse componentwise CLT
    (`chap:forced`).

    Also formalized: the probabilistic prerequisites of Part II that are not in Mathlib, stated
    for their own sake and intended for eventual upstreaming — martingale SLLN
    (`chap:pre_slln`), one-sided and sharp-loglog martingale LIL with the i.i.d.
    Hartman–Wintner LIL and optional skipping (`chap:pre_lil`, `chap:pre_llil`), the martingale
    CLT and an abstract Anscombe theorem (`chap:pre_clt`), and the supporting o_p/O_p,
    predictable quadratic variation and multivariate Taylor API (`chap:pre_orders`).
    These live under `AlphaRAR/Mathlib/`.

    Not formalized: the hypothesis-testing application (`chap:testing`) beyond the idempotent
    projection lemma — the Pearson statistic, its quadratic-form rewriting and its asymptotic
    null distribution are stated in the blueprint only; the χ²/Cochran prerequisites
    (`chap:pre_cochran`); and the exponential-family variance identity `prop:exp_fam` used in
    the asymptotic-efficiency remark `rem:efficiency`.
  # Proof-development sorries only; the deliberate placeholder sorries in the comparator
  # challenge modules (comparator/Challenge_*.lean) are excluded, as v0.4 specifies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:                    # every main result below depends on exactly these three
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  size:
    lean_lines: 23750
    theorems_and_lemmas: 721
    definitions: 86
    blueprint_tagged_declarations: 225   # blueprint/lean_decls, autogenerated
  main_results:
    - declaration: "AlphaRAR.aRTS_LLN"
      file: "AlphaRAR/YDK2026/ARTSRates.lean"
      source_statement: "Theorem thm:LLN — strong consistency and rates"
      note: >-
        Under Conditions A–B, for an α-throttled αRTS design and every arm k, almost surely:
        N_{n,k}/n → v_k, θ̂_{n,k} → θ_k, and ρ̂_{n,k} − v_k = O(√(log log n / n)).
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTS_LLN.json"
      literature_dependencies: []
    - declaration: "AlphaRAR.aRTS_clt_joint"
      file: "AlphaRAR/YDK2026/ARTSNormality.lean"
      source_statement: "Theorem thm:normality, part (ii) — asymptotic normality"
      note: >-
        Joint CLT for (√n(N_n/n − v), √n(ρ̂_n − v)) ⇒ 𝒩(0, Ω) for the αRTS design; the
        proportion-deviation hypothesis is discharged from `aRTS_prop_dev`. The marginal
        estimator CLT √n(θ̂_n − θ) ⇒ 𝒩(0, V) is `AlphaRAR.clt_rho`'s companion
        `AlphaRAR.estimator_sqrtN_joint_tendsto_multivariateGaussian`.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTS_clt_joint.json"
      literature_dependencies: []
    - declaration: "AlphaRAR.aRTS_prop_dev"
      file: "AlphaRAR/YDK2026/PropDevARTS.lean"
      source_statement: "Theorem thm:normality, part (i) — |N_{n,k} − n ρ̂_{n,k}| = o_p(√n)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTS_prop_dev.json"
      literature_dependencies: []
    - declaration: "AlphaRAR.aRTS_prop_dev_ae"
      file: "AlphaRAR/YDK2026/PropDevLIL.lean"
      source_statement: "Theorem thm:normality, part (i) — a.s. O(√(n log log n)) deviation"
      note: >-
        Companion `AlphaRAR.aRTS_count_sub_smul_ae` (same file) gives
        N_{n,k} − n v_k = O(√(n log log n)) a.s.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTS_prop_dev_ae.json"
      literature_dependencies: []
    - declaration: "AlphaRAR.aRTSFE_sparse_clt_of_contDiffAt"
      file: "AlphaRAR/YDK2026/ForcedExploration.lean"
      source_statement: "Corollary corr:componentwise — sparse componentwise CLT for αRTS-FE"
      note: >-
        Proved under a *modified* exploration-schedule condition; see `fidelity.divergences`.
        `AlphaRAR.aRTSFE_sparse_clt` is the same conclusion with the regularity input taken as
        a hypothesis; `AlphaRAR.sched23_satisfies_schedule_hypotheses` shows the modified
        hypotheses are satisfiable (by h(n) = n^{2/3}).
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTSFE_sparse_clt_of_contDiffAt.json"
      literature_dependencies: []
    - declaration: "AlphaRAR.aRTSFE_sparse_rate_of_isARTSFE"
      file: "AlphaRAR/YDK2026/ForcedExploration.lean"
      source_statement: "Theorem thm:sparse_rate — consistency and rate for sparse targets"
      note: >-
        Stated from the history-level design predicate `IsARTSFE`, like the other headline
        results. `AlphaRAR.aRTSFE_sparse_rate` (same file) is the same conclusion from the raw
        process-level throttle and forced-exploration hypotheses; the `IsARTSFE` form discharges
        them through `throttle_of_isARTSFE`/`fe_of_isARTSFE`.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/aRTSFE_sparse_rate.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-8", "claude-opus-5"]   # 4.8 first, then 5 once it released
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in a local checkout, driving `lake build` and the blueprint toolchain
        (`leanblueprint pdf/web/checkdecls`) directly. Project-level memory files recorded
        conventions and recurring Lean pitfalls across sessions. No custom MCP servers, no
        proof-search tooling beyond Mathlib's own tactics; one small in-project tactic
        (`AlphaRAR/Mathlib/Tactic/Tendsto.lean`) was written during the project.
      cost:
        wall_time: "3 weeks (2026-07-07 to 2026-07-28), 53 commits"
        spend_usd: "subscription-based usage"
        hardware: "API-only (developer laptop)"
      prompting_notes: >-
        Blueprint-driven. The blueprint itself was written by the agent, not by hand: for each
        area of the paper the agent first produced the LaTeX decomposition into small lemmas,
        which the human author reviewed, and was then pointed at individual blueprint items (by
        label, e.g. `lem:prop_dev`) and asked to formalize them, keeping the `\lean{}`/`\leanok`
        tags in the LaTeX in sync with the Lean source. Blueprint and Lean therefore grew
        together, and the decomposition was revised as formalization exposed problems with it.
        Work was scoped to one coherent mathematical area at a time rather than to scattered
        individual lemmas. Every mathematical divergence from the paper was written up as a
        standalone note (`maths/`, `notes/`) and reviewed before the corresponding Lean was
        accepted.
  spend_usd: "subscription-based usage"
  notes: >-
    All Lean in this repository was produced with Claude Code under human direction and review,
    as were the blueprint LaTeX and the choice of decomposition into small lemmas. The two
    divergences below came out of that collaboration. The agent found the gap in the paper's
    `lem:componentwise` (divergence 1), explored fixes, and reported that recovering the sparse
    corollary was blocked by the paper's schedule condition h(n) = o(√n). The human author —
    the paper's co-authors having already suspected that condition was unnecessarily
    restrictive — directed it to relax the condition by strengthening the proofs rather than
    working around it; the agent then found the relaxation to h(n) = o(n) and the proof under
    (⋆) √(n log log n) ≪ h(n) = o(n) (divergence 2). Every such decision was reviewed and
    accepted by the human author.

fidelity:
  divergences: >-
    1. Sparse componentwise CLT — hypothesis changed. The paper's Lemma `lem:componentwise`
    ("Joint CLT with componentwise scaling") is stated under the hypothesis that every treatment
    is sampled infinitely often (N_{n,k} → ∞ a.s.). That hypothesis is not sufficient: the proof
    in `arxiv/sections/appendixA.tex` verifies the self-normalized Lindeberg condition and then
    applies a martingale CLT to a randomly normalized martingale, which additionally needs a
    stabilization/regularity hypothesis that is never established, and a law-of-the-iterated-
    logarithm construction shows the conclusion genuinely fails without it. The formalized
    statement `AlphaRAR.estimatorError_joint_tendsto_multivariateGaussian` therefore assumes
    regularity, N_{n,k}/c_{k,n} → 1 for a deterministic sequence c. The non-sparse results are
    unaffected (regularity holds there for free). Write-up: `notes/regularity-gap.md`.

    2. αRTS-FE exploration schedule — condition reversed. To recover the sparse corollary
    `corr:componentwise`, the paper's schedule condition h(n) = o(√n) is replaced by
    (⋆) √(n log log n) ≪ h(n) = o(n). This is not a weakening in the paper's direction: it is a
    different condition, and the two overlap only trivially. It is justified because (a) the
    paper's h = o(√n) is not needed for the non-sparse theory — under Condition B forced
    exploration switches itself off (`AlphaRAR.underExplored_eventually_empty`), so h(n) = o(n)
    suffices — and (b) (⋆) delivers exactly the regularity hypothesis of divergence 1 for sparse
    arms (`AlphaRAR.pullCount_div_sched_tendsto_one`). `AlphaRAR.sched23_satisfies_schedule_hypotheses`
    checks that h(n) = n^{2/3} satisfies (⋆) and fails the paper's condition, so the result is
    not vacuous. Write-up: `maths/sparse-clt-fix.md`.

    3. Generalizations and restatements. The asymptotic theory is proved once from an abstract
    hitting-time interface (blueprint `chap:generic`) and instantiated for both αRTS and αRTS-FE,
    rather than being reproved per design; unused hypotheses of the paper's lemmas were dropped
    where the Lean proof did not need them. The unconditional bounded-increment LIL
    `AlphaRAR.ae_eventually_abs_le_sqrt_nat_mul_loglog_of_bdd` replaces an application of the
    standard martingale LIL, whose ⟨M⟩ → ∞ hypothesis is false for a generic αRTS design.
    Indexing is 0-based throughout (arm 0 first), against the paper's 1-based convention.

review:
  status: "author-verified"
  reviewers:
    - "Rémy Degenne"    # author of the source paper and of the formalization
  notes: >-
    Every formalized blueprint item carries an explicit `\lean{}` tag naming the Lean
    declaration, checked mechanically against the Lean source by `leanblueprint checkdecls` in
    CI, and a `\leanok` mark asserting that the statement was read against the paper. The two
    places where the paper's statements do not survive that reading are recorded above and
    written up in full in `notes/regularity-gap.md` and `maths/sparse-clt-fix.md`. No
    independent reviewer has audited the formalization.

    Each main result above additionally has a leanprover/comparator setup (its
    `comparator_config`): a short self-contained challenge file under `comparator/` restates the
    theorem with its definitional dependencies inlined — the import closure of every challenge
    bottoms out in Mathlib alone, with the few LML declarations the statements rest on vendored
    verbatim into the challenge and checked for identity — and comparator verifies mechanically
    that the project proves exactly that statement from exactly the three axioms listed, with
    the proof replayed through the Lean kernel. `scripts/comparator-verify.sh` runs all six; see
    `comparator/README.md` for the trust model.

alignment:
  namespace: "AlphaRAR"
  note: >-
    The full source-to-Lean map is the blueprint itself: each theorem/lemma/definition
    environment in `blueprint/src/chapters/*.tex` carries a `\lean{}` tag naming the
    corresponding declaration, and the dependency graph is rendered on the blueprint website.
    `blueprint/lean_decls` is the autogenerated list of tagged declarations. Only the headline
    statements are repeated here.
  statements:
    - source: "thm:LLN — strong consistency and rates"
      lean: "AlphaRAR.aRTS_LLN"
      module: "AlphaRAR.YDK2026.ARTSRates"
      status: "proved"
      note: ""
    - source: "thm:normality (i) — proportion deviations"
      lean: "AlphaRAR.aRTS_prop_dev, AlphaRAR.aRTS_prop_dev_ae, AlphaRAR.aRTS_count_sub_smul_ae"
      module: "AlphaRAR.YDK2026.PropDevARTS, AlphaRAR.YDK2026.PropDevLIL"
      status: "proved"
      note: ""
    - source: "thm:normality (ii) — asymptotic normality"
      lean: "AlphaRAR.aRTS_clt_joint"
      module: "AlphaRAR.YDK2026.ARTSNormality"
      status: "proved"
      note: ""
    - source: "lem:clt_rho — CLT for the plug-in target"
      lean: "AlphaRAR.clt_rho"
      module: "AlphaRAR.YDK2026.PluginTargetCLT"
      status: "proved"
      note: ""
    - source: "lem:componentwise — joint CLT with componentwise scaling"
      lean: "AlphaRAR.estimatorError_joint_tendsto_multivariateGaussian"
      module: "AlphaRAR.YDK2026.ResponseCLTJoint"
      status: "proved"
      note: "Statement strengthened by a regularity hypothesis; see fidelity.divergences item 1."
    - source: "thm:forced_valid — validity under forced exploration"
      lean: "AlphaRAR.aRTSFE_proportion_tendsto, AlphaRAR.aRTSFE_prop_dev, AlphaRAR.aRTSFE_prop_dev_ae, AlphaRAR.aRTSFE_count_sub_smul_ae, AlphaRAR.aRTSFE_clt_joint"
      module: "AlphaRAR.YDK2026.ForcedExploration"
      status: "proved"
      note: ""
    - source: "lem:fe_no_starvation — every arm is sampled infinitely often"
      lean: "AlphaRAR.aRTSFE_no_starvation"
      module: "AlphaRAR.YDK2026.ForcedExploration"
      status: "proved"
      note: ""
    - source: "thm:sparse_rate — consistency and rate for sparse targets"
      lean: "AlphaRAR.aRTSFE_sparse_rate, AlphaRAR.aRTSFE_sparse_rate_of_isARTSFE"
      module: "AlphaRAR.YDK2026.ForcedExploration"
      status: "proved"
      note: ""
    - source: "corr:componentwise — sparse componentwise CLT"
      lean: "AlphaRAR.aRTSFE_sparse_clt_of_contDiffAt"
      module: "AlphaRAR.YDK2026.ForcedExploration"
      status: "proved"
      note: "Under the modified schedule condition (⋆); see fidelity.divergences item 2."
    - source: "chap:design — the three example designs"
      lean: "AlphaRAR.distance_isARTS, AlphaRAR.erade_isARTS, AlphaRAR.dTracking_isARTS"
      module: "AlphaRAR.YDK2026.ARTSDesigns"
      status: "proved"
      note: "Distance-based, ERADE 2025, interpolated D-Tracking; definitions and simplex lemmas also formalized."
    - source: "rem:efficiency / prop:exp_fam — asymptotic efficiency"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "Needs the exponential-family variance/inverse-Fisher-information identity, deliberately out of scope."
    - source: "chap:testing — Pearson statistic and its null distribution"
      lean: "AlphaRAR.isProjection_one_sub_vecMulVec"
      module: "AlphaRAR.Mathlib.Projection"
      status: "in-progress"
      note: "Only lem:projection is formalized; def:pearson_stat, lem:pearson_quadform and lem:pearson are blueprint-only, pending the χ²/Cochran prerequisites of chap:pre_cochran."

acknowledgements: >-
  `AlphaRAR/Mathlib/CramerWold.lean` is vendored verbatim from Mathlib PR #40345 by Ivo
  Malinowski, pending that PR's merge; it is not work of this project.
  Built on Mathlib. Depends on LeanMachineLearning/LML for the bandit/algorithm-environment
  interaction model (`Learning.IsAlgEnvSeq`, `Learning.armIndicator`), on LeanSpec for
  specification statements, and on Patrick Massot's leanblueprint/checkdecls for the blueprint
  infrastructure. The material under `AlphaRAR/Mathlib/` is written to be contributed upstream
  to Mathlib (but needs further review and refinement).
