name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write         # Publish the dataset release, and push the provenance ledger to its branch
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing for provenance, not just a convenience: the ledger's edit half is
          # `git blame`, and at the default `fetch-depth: 1` blame attributes the entire library to
          # the single fetched commit.  The action would unshallow the checkout itself, but
          # fetching it here saves that second round trip.
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # 2025-07-02
        with:
          build: true
          lint: true
          # Restricted to the AlphaRAR library below: the bare `mk_all --check` chokes on the
          # Comparator library, whose modules are globs with no module directory.
          mk_all-check: false

      - name: mk_all check (AlphaRAR library only)
        run: |
          set -euo pipefail
          lake exe mk_all --check --lib AlphaRAR

      # The comparator challenge/solution modules (see comparator/README.md). Building them here
      # keeps them compiling against the current tree, and `checkdecls` (inside the blueprint
      # step below) imports every library root of the workspace, so the Comparator library's stub
      # root module must have an olean by then. The library's real modules are globs, not roots,
      # exactly so that root-importing tools (checkdecls, referee) never load the challenges,
      # which redeclare project and LML names.
      - name: Build comparator challenges
        run: |
          set -euo pipefail
          lake build Comparator

      # The referee site, built with the LeanTrustBuilders suite: the extractor's action writes the
      # dataset (the newest trust-extract release for this project's toolchain, following
      # dependencies into LeanMachineLearning, Mathlib and Lean core) and publishes it as the
      # release dataset-<commit12>; trust-site (github.com/LeanTrustBuilders/referee-site) builds
      # the site from it, against the previous build as baseline and with the provenance ledger,
      # which is kept on its own branch, trust-ledger, so that recording a build never touches main.
      - name: Name the dataset
        if: github.event_name == 'push'
        run: |
          echo "TAG=dataset-$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_ENV"
          echo "DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
          echo "LABEL=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Extract and publish the dataset
        id: extract
        if: github.event_name == 'push'
        uses: LeanTrustBuilders/extractor/extract@main
        with:
          root: AlphaRAR
          repo: ${{ github.repository }}
          args: --upstream-closure term
          # Lean's kernel checks every closure the dataset records, proofs included.
          check: meaning term
          publish: ${{ env.TAG }}
          title: AlphaRAR ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'push'
        with:
          python-version: '3.12'

      - name: trust-site, with evidence-core and evidence-store
        if: github.event_name == 'push'
        run: pip install -q git+https://github.com/LeanTrustBuilders/referee-site

      - name: Baseline and ledger
        if: github.event_name == 'push'
        env:
          DATASET: ${{ steps.extract.outputs.dataset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/ledger"
          if git fetch -q origin trust-ledger; then
            git worktree add -q -B trust-ledger "$L" FETCH_HEAD
          else
            git worktree add -q --orphan -b trust-ledger "$L"
          fi
          echo "LEDGER=$L/ledger.json" >> "$GITHUB_ENV"
          # The baseline is the previous build the ledger recorded, whose dataset is a release here.
          prev=$(evidence-core ledger --ledger "$L/ledger.json" --previous "$GITHUB_SHA")
          if [ -n "$prev" ] && evidence-store dataset --repo "$GITHUB_REPOSITORY" --tag 'dataset-{commit12}' \
              --commit "$prev" --out "$RUNNER_TEMP/baseline" > /dev/null; then
            echo "BASELINE=--baseline $RUNNER_TEMP/baseline" >> "$GITHUB_ENV"
          fi
          evidence-core ledger --ledger "$L/ledger.json" --dataset "$DATASET" --date "$DATE" --label "$LABEL"
          cd "$L"
          git add ledger.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "AlphaRAR ${GITHUB_SHA:0:7}: record the build"
            git push -q origin trust-ledger
          fi

      - name: Build the referee site
        if: github.event_name == 'push'
        env:
          DATASET: ${{ steps.extract.outputs.dataset }}
        run: |
          set -euo pipefail
          # An editorial claim, not a derived fact: it says whoever publishes this site vouches for
          # Mathlib and everything under it. Drop it and every upstream package counts as unaudited.
          trust-site build --dataset "$DATASET" --source . ${BASELINE:-} --ledger "$LEDGER" \
            --trust mathlib --out "$RUNNER_TEMP/referee"

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@56023ee2a4b3630c1071825be5bafdb43f540bbd # 2026-08-21
        with:
          blueprint: true
          api-docs: false
          homepage: home_page
          build-page: false
          deploy: false

      # After the blueprint step, which writes `blueprint/` and `docs/` into the same folder. It
      # only ever adds, so the order is not load-bearing — but copying last keeps the referee output
      # out of reach of anything else that writes there.
      - name: Add the referee site to the home page
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p home_page/referee
          cp -r "$RUNNER_TEMP/referee/." home_page/referee/

      - name: "Upload website (API documentation, blueprint and any home page)"
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
